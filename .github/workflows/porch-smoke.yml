name: pragmatic-orchestration

on:
  pull_request:
    paths:
      - 'skills/pragmatic-orchestration/**'
      - '.github/workflows/porch-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'skills/pragmatic-orchestration/**'
      - '.github/workflows/porch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: skills/pragmatic-orchestration
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Platform regressions with native Python
        run: python scripts/tests/platform_test.py -v

      - name: Read-only UI observer boundary
        run: python scripts/tests/ui_test.py -v

      - name: Config helpers emit LF-only agent ids
        run: |
          export PORCH_CONFIG="$PWD/scripts/tests/fixtures/test-config.json"
          source scripts/lib/common.sh
          source scripts/lib/config.sh
          config_validate
          ids="$(mktemp)"
          trap 'rm -f "$ids"' EXIT
          config_enabled_agents > "$ids"
          test -s "$ids"
          if grep -q $'\r' "$ids"; then
            echo 'CR found in config_enabled_agents output'
            exit 1
          fi
          while IFS= read -r agent; do
            backend="$(config_get_field "$agent" backend)"
            test -n "$backend"
            echo "$agent -> $backend"
          done < "$ids"

      - name: porch --help
        run: bash scripts/porch --help

      # The existing shell harness uses POSIX executable and /tmp semantics.
      # Windows is gated by native-Python integration tests above.
      - name: Full offline regression suite
        if: runner.os != 'Windows'
        run: bash scripts/tests/run.sh

  ui:
    name: optional UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/pragmatic-orchestration/ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: xvfb-run -a pnpm test:desktop
