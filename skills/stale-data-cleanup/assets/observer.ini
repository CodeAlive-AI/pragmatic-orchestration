# Copy to ${XDG_CONFIG_HOME:-~/.config}/stale-data-cleanup/observer.ini.
# Quoting for [notify] command follows POSIX shell words (shlex); the command is
# executed directly without a shell. The message is appended as one final argument.
[notify]
command = /usr/bin/logger -t disk-watch
# Optional one-line templates. Placeholders: {machine}, {free}, {total}, {target},
# {floor}, {free_gb}, {total_gb}, {pressure}, {days_until_full}, {report_path}.
# Size suffixes are binary: 100G is 100 GiB (107.4 GB); write 93.13G for 100 GB.
# decide = {machine}: {free_gb} GB free of {total_gb} GB, below the target {target}. {report_path}
# now = Urgent: {machine} has {free_gb} GB free of {total_gb} GB; full in {days_until_full}. {report_path}
# floor = BELOW THE FLOOR: {machine} has {free_gb} GB free of {total_gb} GB; floor {floor}. {report_path}
# scan_failed = {machine}: the disk observation keeps failing. {report_path}

[laptop]
root = /System/Volumes/Data
target_free = 100G
floor_free = 50G
keep = 8
scan_timeout_minutes = 45
# stocks = /Users/example/.local/state/stale-data-cleanup/laptop/stocks.tsv

[build-host]
root = /srv
ssh = build-host
target_free = 20%
keep = 8
scan_timeout_minutes = 45
